<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CallTogether</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="panel">
      <div class="status-row">
        <span class="dot" data-dot></span>
        <p id="status" class="status">Ready — start capture from the toolbar popup</p>
      </div>

      <div class="transcript show-placeholder" id="transcript">
        <span id="finalText"></span><span id="partialText" class="partial"></span>
      </div>

      <div class="actions">
        <button id="shareBtn" type="button">Open capture</button>
        <button id="stopBtn" type="button" class="secondary" disabled>Stop</button>
        <button id="clearBtn" type="button" class="ghost">Clear</button>
      </div>

      <p class="hint" id="hint">
        Local STT · no mic · hotkey pastes into the focused AI input
      </p>
    </div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
