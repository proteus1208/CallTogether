<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CallTogether</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="panel" id="panelRoot">
      <div class="status-row">
        <span class="dot" data-dot></span>
        <p id="status" class="status">Ready</p>
        <kbd id="hotkeyBadge" class="hotkey" title="Paste hotkey">Alt+W</kbd>
      </div>

      <div class="body-row">
        <div class="col transcript-col">
          <div class="col-head">
            <div class="col-label">Transcript</div>
            <div class="col-head-slot" aria-hidden="true"></div>
          </div>
          <div class="transcript show-placeholder" id="transcript">
            <div class="session-list" id="transcriptSessions"></div>
            <div class="session-item partial" id="partialText"></div>
          </div>
        </div>

        <div class="col translate-pane" id="translatePane" aria-hidden="true">
          <div class="col-head">
            <div class="col-label">Translation</div>
            <div class="lang-picker" id="langPicker">
              <button
                id="langBtn"
                type="button"
                class="lang-btn"
                title="Target language"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span id="langBtnLabel">Chinese (Simplified)</span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="currentColor" d="M7 10l5 5 5-5H7z" />
                </svg>
              </button>
              <div class="lang-menu" id="langMenu" hidden>
                <input
                  id="langSearch"
                  type="search"
                  placeholder="Search language…"
                  autocomplete="off"
                  spellcheck="false"
                />
                <ul id="langList" role="listbox"></ul>
              </div>
            </div>
          </div>
          <div class="translate-text show-placeholder" id="translateText">
            <div class="session-list" id="translateSessions"></div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="shareBtn" type="button">Share</button>
        <button
          id="stopBtn"
          type="button"
          class="icon-btn secondary"
          title="Stop"
          aria-label="Stop"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" />
          </svg>
        </button>
        <button
          id="clearBtn"
          type="button"
          class="icon-btn ghost"
          title="Clear"
          aria-label="Clear"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M9 3h6l1 2h4v2H4V5h4l1-2zm1 6h2v9h-2V9zm4 0h2v9h-2V9zM7 9h2v9H7V9zm-1 12h12a1 1 0 0 0 1-1V8H5v12a1 1 0 0 0 1 1z"
            />
          </svg>
        </button>
        <button
          id="translateBtn"
          type="button"
          class="icon-btn ghost"
          title="Translate"
          aria-label="Translate"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12.9 15h-1.8L9.7 11H7.8l2.9 7h1.7l.7-1.8zm7.6-11h-6.2l-.8 2H16v2h-2.1c-.3 1.1-.8 2.1-1.4 3 .8.7 1.7 1.3 2.7 1.7l-.7 1.9c-1.3-.5-2.4-1.3-3.4-2.2-.9.9-2 1.6-3.2 2.1l-.8-1.8c1-.4 1.9-1 2.7-1.7C9 10.4 8.3 9 7.9 7.5H10V5.5H4v-2h4.5L7.7 2h2.1l.8 2H20.5v2zM5.3 19.5 4 18.2 18.2 4l1.3 1.3L5.3 19.5z"
            />
          </svg>
        </button>
        <button
          id="submitBtn"
          type="button"
          class="icon-btn"
          title="Paste and send"
          aria-label="Paste and send"
        >
          <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M3.4 20.6 21 12 3.4 3.4l.1 6.5L15 12 3.5 14.1l-.1 6.5z"
            />
          </svg>
          <svg class="icon-spinner" viewBox="0 0 24 24" aria-hidden="true">
            <circle
              cx="12"
              cy="12"
              r="9"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-dasharray="40 60"
            />
          </svg>
        </button>
      </div>
    </div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
