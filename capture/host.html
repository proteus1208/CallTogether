<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CallTogether</title>
    <link rel="stylesheet" href="host.css" />
  </head>
  <body>
    <main>
      <h1>CallTogether</h1>
      <p class="sub">Choose what to share, then enable audio.</p>
      <p id="status" class="status">Ready</p>
      <div class="actions">
        <button id="shareBtn" type="button">Choose sound source</button>
        <button id="stopBtn" type="button" class="secondary" disabled>Stop</button>
      </div>
    </main>
    <script type="module" src="host.js"></script>
  </body>
</html>
