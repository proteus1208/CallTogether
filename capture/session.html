<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Choose what to share with CallTogether</title>
    <link rel="stylesheet" href="session.css" />
  </head>
  <body>
    <main class="share-dialog" role="dialog" aria-labelledby="shareTitle">
      <h1 id="shareTitle">Choose what to share with CallTogether</h1>
      <p class="subtitle">
        CallTogether will capture the sound from what you share (enable audio in
        the next dialog).
      </p>

      <p id="status" class="status">Ready</p>

      <button id="shareBtn" type="button" class="primary">
        Choose sound source
      </button>
      <button id="stopBtn" type="button" class="secondary" disabled hidden>
        Stop capture
      </button>

      <p class="hint">
        Chrome’s picker opens next — pick a Chrome tab, window, or entire screen
        and turn audio on. Keep this window open while capturing.
      </p>
    </main>

    <iframe
      id="sandbox"
      src="../sandbox/transcribe.html"
      style="display: none; width: 0; height: 0; border: 0"
    ></iframe>
    <script type="module" src="session.js"></script>
  </body>
</html>
