<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Allow microphone</title>
    <link rel="stylesheet" href="mic.css" />
  </head>
  <body>
    <main>
      <h1>Microphone access</h1>
      <p>
        CallTogether needs your microphone for live transcripts. Click the button
        below — Chrome will show a permission popup. Choose <strong>Allow</strong>.
      </p>
      <button id="allowBtn" type="button">Allow microphone</button>
      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script type="module" src="mic.js"></script>
  </body>
</html>
