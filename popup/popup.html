<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CallTogether</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>CallTogether</h1>
        <p>Capture call audio → transcript → paste into AI chat</p>
      </header>

      <section class="state">
        <div class="row">
          <span>Status</span>
          <strong id="statusLabel">Idle</strong>
        </div>
        <div class="transcript" id="transcriptPreview">No transcript yet</div>
      </section>

      <section class="actions">
        <button id="startBtn" type="button">Start</button>
        <button id="stopBtn" type="button" class="secondary" disabled>Stop</button>
        <button id="clearBtn" type="button" class="ghost">Clear</button>
      </section>

      <p id="error" class="error" hidden></p>

      <footer>
        <a href="#" id="openOptions">Settings</a>
        <span>Hotkey pastes + Enter on the AI page</span>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
