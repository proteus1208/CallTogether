<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CallTogether</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>CallTogether</h1>
        <p>Capture sound → AI chat</p>
      </header>

      <section class="state">
        <div class="row">
          <span>Status</span>
          <strong id="statusLabel">Idle</strong>
        </div>
      </section>

      <label class="toggle-row" for="floatToggle">
        <span>
          <strong>Floating panel</strong>
          <small>Show on the AI page</small>
        </span>
        <input id="floatToggle" type="checkbox" role="switch" />
      </label>

      <section class="actions stacked">
        <button id="startTabBtn" type="button">Share Chrome tab audio</button>
        <button id="startScreenBtn" type="button" class="secondary">
          Share screen audio (Windows apps)
        </button>
        <button id="stopBtn" type="button" class="ghost" disabled>Stop</button>
      </section>

      <button id="clearBtn" type="button" class="ghost full">Clear transcript</button>

      <p id="error" class="error" hidden></p>
      <p class="hint" id="hint">
        Chrome cannot share audio from a single <strong>Window</strong>. For Media
        Player / Zoom / desktop apps, use <strong>Entire Screen</strong> and enable
        <strong>Share system audio</strong>.
      </p>

      <footer>
        <a href="#" id="openOptions">Settings</a>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
